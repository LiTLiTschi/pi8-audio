<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    WirePlumber (uid 1000) ↔ bluetoothd A2DP: stock system.conf only permits
    method_return/error when send_requested_reply=true. BlueZ MediaEndpoint
    negotiation uses errors with requested_reply=0; without these rules journal shows:
      Rejected send message, 0 matched rules ... MediaEndpoint1.Error.NotImplemented
    and phones report "couldn't connect" after pairing/discovery succeeds.

    Install as /etc/dbus-1/system.d/zz-pi8-bluetooth-wireplumber-policy.conf (zz- prefix
    loads after other local fragments on Ubuntu). Then: sudo systemctl reload dbus

    References: https://github.com/bluez/bluez/issues/1924
  -->
  <policy context="default">
    <allow send_interface="org.bluez.MediaEndpoint1"/>
    <allow send_interface="org.bluez.MediaPlayer1"/>
    <allow send_interface="org.bluez.Profile1"/>
    <allow send_interface="org.bluez.GattCharacteristic1"/>
    <allow send_interface="org.bluez.GattDescriptor1"/>
    <allow send_interface="org.bluez.LEAdvertisement1"/>
    <allow send_interface="org.bluez.AdvertisementMonitor1"/>
    <allow send_interface="org.bluez.Agent1"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_type="error"/>
    <allow send_type="method_return"/>
  </policy>
</busconfig>
