# TTY1: auto-login so a headless Pi shows a shell + dashboard without a keyboard at login:
#   liu ALL=(ALL) NOPASSWD: /usr/bin/chvt 1, /usr/bin/chvt 2
# is already used by display-daemon — keep physical console useful for debugging.
#
# Install: sudo mkdir -p /etc/systemd/system/getty@tty1.service.d
#          sudo cp .../autologin.conf /etc/systemd/system/getty@tty1.service.d/
#          sudo systemctl daemon-reload && sudo systemctl restart getty@tty1
#
# Change the username below if your login user is not "liu".

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin liu --noclear %I $TERM
